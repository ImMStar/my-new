services:
  - type: web
    name: jio-flexi-portfolio-index-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webhook:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BASE_DATE
        value: "2026-11-11"
      - key: BASE_INDEX
        value: "1000"
      - key: MIN_HOLDINGS
        value: "80"
      - key: MIN_WEIGHT_COVERAGE
        value: "75"
